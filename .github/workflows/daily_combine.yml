name: Daily Combine All High Courts

on:
  schedule:
    - cron: "0 8 * * *"   # 8:00 AM UTC = 1:00 PM PKT — after all 5 sources update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pyarrow requests openpyxl

      - name: Build combined parquet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python build_parquet.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/combined_dashboard_master.parquet
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily combined update: $(date -u +'%Y-%m-%d')"
            git push
          fi
